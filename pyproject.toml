[project]
name = "jenkins-mcp"
version = "0.1.2"
description = "MCP server for triggering Jenkins jobs and returning their results"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Only needed for MCP_TRANSPORT=streamable-http / sse.
http = ["uvicorn>=0.30"]

[project.scripts]
jenkins-mcp = "jenkins_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jenkins_mcp"]
