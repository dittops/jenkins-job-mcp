{{- include "jenkins-mcp.validate" . }}
{{- if not .Values.jenkins.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jenkins-mcp.secretName" . }}
  labels:
    {{- include "jenkins-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.jenkins.auth.userKey }}: {{ .Values.jenkins.auth.user | quote }}
  {{ .Values.jenkins.auth.apiTokenKey }}: {{ .Values.jenkins.auth.apiToken | quote }}
  {{- with .Values.jenkins.auth.buildToken }}
  {{ $.Values.jenkins.auth.buildTokenKey }}: {{ . | quote }}
  {{- end }}
{{- end }}
