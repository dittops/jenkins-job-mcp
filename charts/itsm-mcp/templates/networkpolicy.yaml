{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "itsm-mcp.fullname" . }}
  labels:
    {{- include "itsm-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "itsm-mcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
{{- if .Values.networkPolicy.from }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.from | nindent 8 }}
      ports:
        - port: {{ .Values.mcp.port }}
          protocol: TCP
{{- else }}
  # No peers listed, so every inbound connection is denied. Populate
  # networkPolicy.from with the clients that should reach the server.
  ingress: []
{{- end }}
{{- end }}
